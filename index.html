<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download KetchupClient</title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }

        h1 { color: #333; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }

        /* Red Download Button */
        .download-button {
            display: inline-block;
            padding: 15px 35px;
            background-color: #d32f2f;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .download-button:hover {
            background-color: #b71c1c;
            transform: scale(1.05);
        }

        .version-tag {
            display: block;
            margin-bottom: 15px;
            color: #d32f2f;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>KetchupClient</h1>
        <span class="version-tag">Version 1.21.11</span>
        <p>Get the latest version of KetchupClient now.</p>
        
        <a href="Ketchupclient.jar" download="Ketchupclient-1.21.11.jar" class="download-button">
            Download Now
        </a>
    </div>

</body>
</html>
